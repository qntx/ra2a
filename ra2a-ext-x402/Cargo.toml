[package]
name = "ra2a-ext-x402"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
authors = ["Gentech Labs"]
description = "x402 payments extension for the A2A Rust SDK (ra2a) — per google-agentic-commerce/a2a-x402 v0.1"
keywords = ["a2a", "agent", "x402", "payments", "extensions"]
categories = ["network-programming"]

[dependencies]
ra2a = { workspace = true }
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }

[features]
default = ["client", "server"]
client = ["ra2a/client"]
server = ["ra2a/server"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
tokio.workspace = true
